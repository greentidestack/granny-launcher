<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Granny 1 Launcher</title>

<link rel="icon" href="https://play-lh.googleusercontent.com/P8BbkQ6m0eCYYAx2tXTESBiIDQ2RESsSQp6oD8ZAP35rmEjmaXHMboYT6P807sAnfcuskKTdYbTyH5R0GCFk8Q">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
@import url('https://fonts.googleapis.com/css2?family=Saira:ital,wght@0,100..900;1,100..900&display=swap'); 
@import url('https://fonts.googleapis.com/css2?family=Quintessential&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Quintessential&family=Special+Elite&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display+SC:ital,wght@0,400;0,700;0,900;1,400;1,700;1,900&family=Quintessential&family=Special+Elite&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    cursor: url("https://i.imgur.com/1NgHZDZ.png") 16 16, default!important;
    user-select: none;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Playfair Display SC, sans-serif;
    color: white;
    font-weight: bold;
}

body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    /* The background is attached here to stay perfectly centered without layout shifts */
    background: url('https://i.imgur.com/WxOwemZ.png') center center / 110% 110% no-repeat black;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
}

.play-btn {
    display: inline-flex;
    position: relative;   
    z-index: 10;          
    background: #000;
    border: none;
    color: white;          
    width: 150px;
    height: 70px;   
    font-family: 'Playfair Display SC', sans-serif;
    font-size: 40px;    
    justify-content: center;
    align-items: center;
    right: 35%;
    bottom: 10%;
}

.play-btn:active {
    transform: scale(0.75);
}

.about-btn {
    display: inline-flex;
    position: relative;   
    z-index: 10;          
    background: #000;
    border: none;
    color: white;          
    width: 150px;
    height: 70px;  
    font-family: 'Playfair Display SC', sans-serif;
    font-size: 40px;    
    justify-content: center;
    align-items: center;
    right: 35%;
    top: 10%;
}

.about-btn:active {
    transform: scale(0.75);
}

.modal {
    display: none;
    position: fixed;
    z-index: 100;
    inset: 0;
    background-color: rgba(0, 0, 0, 0.7);
    justify-content: center;
    align-items: center;
}

.modal-content {
    background-color: #111;
    border: 3px solid #fff;
    padding: 30px;
    width: 80%;
    max-width: 500px;
    position: relative;
    text-align: center;
    font-family: Quintessential;
}

.close-btn {
    position: absolute;
    top: 10px;
    right: 20px;
    font-size: 30px;
    color: #fff;
    cursor: pointer !important;
}

.close-btn:hover {
    color: #ff0000;
}
</style>
</head>
<body>

<audio id="menuMusic" loop> <!-- Main menu music -->
    <source src="https://www.image2url.com/r2/default/audio/1782163629626-5d13d2b5-e679-4fd6-99c6-03118956ecd2.mp3" type="audio/mpeg">
</audio>

<button class="play-btn" id="play">PLAY</button>
<br>
<button class="about-btn">ABOUT</button>

<div id="aboutModal" class="modal">
    <div class="modal-content">
        <span class="close-btn">&times;</span>
        <h2><strong>What is this?</strong></h2>
        <p>This is an interactive launcher for different web ports of Granny 1. The site includes ports of versions 1.6 and 1.7, the PC version, mobile version and more.</p>
    </div>
</div>

<script>
const modal = document.getElementById("aboutModal");
const openBtn = document.querySelector(".about-btn");
const closeBtn = document.querySelector(".close-btn");

openBtn.onclick = function() {
    modal.style.display = "flex";
}

closeBtn.onclick = function() {
    modal.style.display = "none";
}

window.onclick = function(event) {
    if (event.target == modal) {
        modal.style.display = "none";
    }
}

document.getElementById("play").addEventListener("click", function() {
    window.location.href = "launcher-menu.html"; 
});

const menuMusic = document.getElementById("menuMusic");

document.addEventListener("click", (e) => {
    menuMusic.play();
}, { once: true });

// New robust tracking method using background position percentage shifting
document.addEventListener("mousemove", (e) => {
    const x = (e.clientX / window.innerWidth) * 70;
    const y = (e.clientY / window.innerHeight) * 70;

    // Maps cursor movements into a safe 45% - 55% range so edges never show
    const backgroundX = 50 + (x - 50) * 0.1;
    const backgroundY = 50 + (y - 50) * 0.1;

    document.body.style.backgroundPosition = `${backgroundX}% ${backgroundY}%`;
});
</script>

</body>
</html>
