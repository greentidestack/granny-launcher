<body>

<h1 class="options-header">Launcher options</h1>

<button class="back-btn" id="back">

<audio id="menuMusic" loop> <!-- Main menu music -->
    <source src="https://www.image2url.com/r2/default/audio/1782163629626-5d13d2b5-e679-4fd6-99c6-03118956ecd2.mp3" type="audio/mpeg">

        style="width: 100%; height: 100%; border: none;">

                Copy URL

<script> 

const versionInfoData = {

    yandex: {
        title: "Yandex",
        text: "*Recommended version<br>*Faster crouch movement<br>*Hide under tables and cabinets<br>*Sound plays after pausing the game"
    },

    original: {
        title: "Original",
        text: "*Stable version<br>*No ads or bloat<br>*None of Yandex's features except sound"
    },

    pcport: {
        title: "PC Port",
        text: "*Granny PC Version 1.7<br>*Much better graphics<br>*Some bugs and less sound effects"
    },

    mobileport: {
        title: "Mobile Port",
        text: "*Mobile version Granny 1.7<br>*Controls are horrible<br>*Has ads<br>*Not recommended"
    },

    yandex2: {
        title: "Yandex 2",
        text: "*Slightly different version of Yandex 1<br>*Different main menu<br>*Gameplay is the same<br>*Sound does not play after pausing the game."
    }

};


const versionSelect = document.getElementById("versionSelect");
const dynamicHeaderTitle = document.getElementById("dynamicHeaderTitle");
const dynamicTitle = document.getElementById("dynamicTitle");
const dynamicText = document.getElementById("dynamicText");


function updateVersionInfo(selectedKey) {

    const data = versionInfoData[selectedKey];

    if (data) {

        dynamicText.style.opacity = 0;

        setTimeout(() => {

            dynamicHeaderTitle.textContent = data.title;
            dynamicTitle.textContent = data.title;
            dynamicText.innerHTML = data.text;
            dynamicText.style.opacity = 1;

        }, 150);

    }

}


// local storge version saving
const savedVersion = localStorage.getItem("SelectedVersion");

if (savedVersion) {

    versionSelect.value = savedVersion;
    updateVersionInfo(savedVersion);

} else {

    updateVersionInfo(versionSelect.value);

}


versionSelect.addEventListener("change", () => {

    localStorage.setItem("SelectedVersion", versionSelect.value);

    updateVersionInfo(versionSelect.value);

});


const loadingScreen = document.getElementById("loadingScreen");
const loadingText = document.getElementById("loadingText");

let loadingInterval = null;
let loadingTimeout = null;


function showLoadingScreen() {

    clearInterval(loadingInterval);
    clearTimeout(loadingTimeout);

    let dots = 1;

    loadingText.textContent = "Loading.";
    loadingScreen.style.display = "block";

    loadingInterval = setInterval(() => {

        dots++;

        if (dots > 3) dots = 1;

        loadingText.textContent =
            "Loading" + ".".repeat(dots);

    }, 150);


    loadingTimeout = setTimeout(() => {

        clearInterval(loadingInterval);

        loadingInterval = null;

        loadingScreen.style.display = "none";

    }, 2000);

}


const gameFrame =
    document.querySelector("#embedContainer object");

function updateGameUrlDisplay() {

    const currentUrl = gameFrame.data || "";

    document.getElementById("gameUrl").value = currentUrl;

}



document.getElementById("launchBtn").addEventListener("click", () => {

    const version =
        document.getElementById("versionSelect").value;

    localStorage.setItem("SelectedVersion", version);


    if (version === "yandex") {

        gameFrame.data =
            "https://st.8games.net/7/igra-grenni-original/";

    }


    if (version === "yandex2") {

        gameFrame.data = 
            "https://app-259805.games.s3.yandex.net/259805/fadb3yakgje68vxwmy7a1khmb3vj9vxc_brotli/index.html?sdk=%2Fsdk%2F_%2Fv2.97c96d6acac215f69e1d.js#origin=https%3A%2F%2Fyandex.com&app-id=259805&device-type=desktop";

    }


    if (version === "original") {

        gameFrame.data =
            "http://granny.gg/content/uploads/granny/index.html";

        // old links i used:
        // https://grannyfree.io/play/granny/ original, but its an iframe
        // https://a.luminsdk.com/g/1782245938-zvb9IWFpeBv1Yjnr2wvlKNlEiJz1KQwrELC6eT839lU/selenite/granny1/index.html doesnt work bc of cloudflare

    }


    if (version === "pcport") {

        gameFrame.data = 
            "https://horrorgames.io/granny-horror.embed";

        // https://granny1.io/granny.embed
        // https://1games.io/game/granny-horror/ (alt if granny1.io stops working)
        // horrorgames.io/granny-horror.embed (alt 2)
        // https://games.yoplay.io/granny-horror/?v=1 (alt 3)
        // http://greentidestack.github.io/GrannyWeb-fork/index.html (horrible port but works... kinda)

    }


    if (version === "mobileport") {

        gameFrame.data =
            "http://cdn.vietdp.com/file/vietdp-games/games/t12026/granny-3/index.html";

    }

    updateGameUrlDisplay();


    document.getElementById("embedContainer").style.display = "block";

    showLoadingScreen();

});


// Beartrap

const trap = document.getElementById("bearTrap");
const beartrapAudio = document.getElementById("beartrap");

beartrapAudio.volume = 1; 


trap.addEventListener("click", () => {

    if (trap.classList.contains("closed")) return;

    if (enableSoundCheckbox.checked) { 

        beartrapAudio.currentTime = 0;
        beartrapAudio.play();

    }

    trap.src =
        "https://i.imgur.com/NLG0GdO.png";

    trap.style.width = "75px";
    trap.style.left = "723px";

    trap.classList.add("closed");

});


// Menu Music

const menuMusic = document.getElementById("menuMusic");
const musicPrompt = document.getElementById("musicPrompt");


document.addEventListener("click", (e) => {

    if (e.target.closest("#launchBtn")) {

        musicPrompt.classList.add("hide");

        setTimeout(() => {

            if (musicPrompt.parentNode) {
                musicPrompt.remove();
            }

        }, 400);

        return;

    }


    if (enableMusicCheckbox.checked) { 

        menuMusic.play();

    }


    musicPrompt.classList.add("hide");

    setTimeout(() => {

        if (musicPrompt.parentNode) {
            musicPrompt.remove();
        }

    }, 400);

}, { once: true });



document.getElementById("launchBtn").addEventListener("click", () => {

    const version =
        document.getElementById("versionSelect").value;

    document.title =
        versionTitles[version] || "Granny 1 Launcher"; 


    if (enableMusicCheckbox.checked) {

        menuMusic.pause();
        menuMusic.currentTime = 0;

    }


    window.addEventListener('beforeunload', function (event) {

        event.preventDefault();
        event.returnValue = ''; 

    });

});


// Parallax background effect

const bg = document.getElementById("bg");

document.addEventListener("mousemove", (e) => {

    const x =
        (e.clientX / window.innerWidth - 0.5) * 5;

    const y =
        (e.clientY / window.innerHeight - 0.5) * 5;


    bg.style.transform =
        `translate(${-x}px, ${-y}px)`;

    trap.style.transform =
        `translate(${-x}px, ${-y}px)`;

});

document.getElementById("back").addEventListener("click", function() {

    window.location.href = "index.html"; 

});

const enableSoundCheckbox =
    document.getElementById("enableSound");

const enableMusicCheckbox =
    document.getElementById("enableMusic");


const savedSoundState =
    localStorage.getItem("enableSound");

const savedMusicState =
    localStorage.getItem("enableMusic");


if (savedSoundState !== null) {

    enableSoundCheckbox.checked =
        savedSoundState === 'true'; 

}


if (savedMusicState !== null) {

    enableMusicCheckbox.checked =
        savedMusicState === 'true'; 

}


enableSoundCheckbox.addEventListener("change", () => {

    if (enableSoundCheckbox.checked) {

        beartrapAudio.volume = 1; 

        localStorage.setItem(
            "enableSound",
            'true'
        ); 

    } else {

        beartrapAudio.volume = 0;

            "enableSound",
            'false'
        ); 

    }

});

        );

        menuMusic.pause(); 

        localStorage.setItem(
            "enableMusic",

        );

});

    event.stopPropagation();

    updateGameUrlDisplay();

copyUrlButton.addEventListener("click", async () => {

    const url = gameUrl.value;

    if (!url) return;


    try {

        await navigator.clipboard.writeText(url);

    } catch (error) {

        gameUrl.select();
        gameUrl.setSelectionRange(0, 99999);

        document.execCommand("copy");

    }


    copyUrlButton.innerHTML =
        '<i class="fa-solid fa-check" style="margin-right: 6px;"></i>Copied!';

    copyUrlButton.classList.add("copied");


    setTimeout(() => {

        copyUrlButton.innerHTML =
            '<i class="fa-regular fa-copy" style="margin-right: 6px;"></i>Copy URL';

        copyUrlButton.classList.remove("copied");

    }, 1500);

});


// Keyvoard controls

const gameEmbed =
    document.getElementById("embedContainer");

let gameIsOpen = false;


function showSettingsButton() {

    gameIsOpen = true;

    settingsButton.style.display = "block";

}


function returnToLauncher() {

    clearInterval(
        typeof loadingInterval !== "undefined"
            ? loadingInterval
            : null
    );

    clearTimeout(
        typeof loadingTimeout !== "undefined"
            ? loadingTimeout
            : null
    );


    if (typeof loadingScreen !== "undefined") {

        loadingScreen.style.display = "none";

    }


    settingsOverlay.style.display = "none";



    gameEmbed.style.display = "none";

    settingsButton.style.display = "none";

    gameIsOpen = false;


    gameFrame.data = "about:blank";


    if (
        typeof enableMusicCheckbox !== "undefined" &&
        enableMusicCheckbox.checked &&
        typeof menuMusic !== "undefined"
    ) {

        menuMusic.currentTime = 0;

        menuMusic.play().catch(() => {});

    }

}



returnLauncherButton.addEventListener(
    "click",
    returnToLauncher
);

document.getElementById("launchBtn").addEventListener("click", () => {

    showSettingsButton();

});


document.addEventListener("keydown", (event) => {


    if (settingsOverlay.style.display === "flex") {
        return;
    }

    const versionSelect =
        document.getElementById("versionSelect");


    if (event.key === "Enter") {

        event.preventDefault();

        document.getElementById("launchBtn").click();

        return;

    }


    if (
        (event.key === "ArrowUp" ||
         event.key === "ArrowDown") &&
        document.activeElement === versionSelect
    ) {

        const count =
            versionSelect.options.length;

        let index =
            versionSelect.selectedIndex;


        if (event.key === "ArrowDown") {

            index =
                (index + 1) % count;

        } else {

            index =
                (index - 1 + count) % count;

        }


        versionSelect.selectedIndex =
            index;

        versionSelect.dispatchEvent(
            new Event("change")
        );

        event.preventDefault();

    }

});
